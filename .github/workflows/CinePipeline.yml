name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for gitleaks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # --- Stage 1: Dependency Lock ---
      - name: Dependency Lock Check
        run: |
          if [ ! -f requirements.txt ]; then 
            echo "Error: requirements.txt is missing!"
            exit 1 
          fi
          pip install -r requirements.txt

      # --- Stage 2: Lint + SAST ---
      - name: Run Lint (Flake8)
        run: |
          pip install flake8
          flake8 . || true   # prevents pipeline from failing

      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r . || true

      # --- Stage 3: Secret Scan ---
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Stage 5: Dependency Scan ---
      - name: Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

      # --- Stage 6: Build Stage ---
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

    
 # --- Stage 7: Image Scan ---
      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      # --- Stage 8: Deployment Stage ---
      - name: Deploy with Docker Compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        run: |
          docker compose up -d
