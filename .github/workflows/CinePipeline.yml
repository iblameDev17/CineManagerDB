name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ] # Updated to 'master' to match your screenshot 
  pull_request:
    branches: [ "master", "develop" ] # 

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    # These secrets are pulled from your GitHub Repo Settings
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.6' 

      # --- Security Scanning Stages ---
      - name: Run Lint (Flake8)
        run: pip install flake8 && flake8 . 

      - name: Run SAST (Bandit)
        run: pip install bandit && bandit -r . 

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2 

      - name: Dependency Scan (pip-audit)
        run: pip install pip-audit && pip-audit 

      # --- Build Stage ---
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest . 

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' 

      # --- Deployment Stage ---
      - name: Deploy with Docker Compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        run: |
          docker-compose up -d
