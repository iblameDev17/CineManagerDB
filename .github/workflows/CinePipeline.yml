name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "main", "develop" ] # Runs on every push to these branches 
  pull_request:
    branches: [ "main", "develop" ] # Runs on PRs to main and develop 

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # --- Stage 1: Checkout & Dependency Lock ---
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.6' 

      - name: Dependency Lock Check
        run: |
          if [ ! -f requirements.txt ]; then exit 1; fi # Fails if requirements.txt missing 
          pip install -r requirements.txt
        # Tool: pip freeze 

      # --- Stage 2: Lint + SAST ---
      - name: Run Lint (Flake8)
        run: pip install flake8 && flake8 . 

      - name: Run SAST (Bandit)
        run: pip install bandit && bandit -r . 
        # Condition: Fails if security issues found 

      # --- Stage 3: Secret Scan ---
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Condition: Fails if hardcoded secrets detected 

      # --- Stage 4: Unit Tests ---
      - name: Run Unit Tests (Pytest)
        run: pip install pytest && pytest 
        # Condition: Fails if tests fail 

      # --- Stage 5: Dependency Scan ---
      - name: Dependency Scan (pip-audit)
        run: pip install pip-audit && pip-audit 
        # Condition: Fails on high vulnerabilities 

      # --- Stage 6 & 7: Docker Build & Image Scan ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 

      - name: Build Docker Image
        run: docker build -t showsecure-app:latest . 

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Fails on high vulnerabilities 

      # --- Stage 8: Deploy (Conditional) ---
      - name: Deploy with Docker Compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          docker-compose up -d
          # Health check logic would go here
