name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  # --- Job 1: Static Analysis (Lint, SAST, Secrets) ---
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Lint (Flake8)
        run: |
          pip install flake8
          flake8 . || true

      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r . || true

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Job 2: Dependency Security Scan ---
  dependency-scan:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

  # --- Job 3: Unit Tests ---
  # This fulfills Success Requirement No. 5: Automated unit tests 
  unit-tests:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Unit Tests
        run: |
          # This runs tests in the /tests folder without needing the app to be 'live'
          pytest tests/

  # --- Job 4: Build and Container Scan ---
  build-and-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # --- Job 5: Deployment ---
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image (for deployment)
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

      - name: Deploy with Docker Compose
        run: |
          # Ensure your docker-compose.yml includes Nginx, Prometheus, and Grafana [cite: 47, 51]
          docker compose up -d
