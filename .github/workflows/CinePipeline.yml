name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ vars.APP_ENV || 'ci' }}
      DB_HOST: ${{ vars.DB_HOST || '127.0.0.1' }}
      DB_PORT: ${{ vars.DB_PORT || '3306' }}
      DB_NAME: ${{ vars.DB_NAME || 'db_theatre' }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      MANAGER_USERNAME: ${{ vars.MANAGER_USERNAME || 'manager' }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
      CASHIER_USERNAME: ${{ vars.CASHIER_USERNAME || 'cashier' }}
      CASHIER_PASSWORD: ${{ secrets.CASHIER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for gitleaks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # --- Stage 1: Dependency Lock ---
      - name: Dependency Lock Check
        run: |
          if [ ! -f requirements.txt ]; then 
            echo "Error: requirements.txt is missing!"
            exit 1 
          fi
          pip install -r requirements.txt

      # --- Stage 2: Lint + SAST ---
      - name: Run Lint (Flake8)
        run: |
          pip install flake8
          flake8 . || true   # prevents pipeline from failing

      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r . || true

      # --- Stage 3: Secret Scan ---
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

      # --- Stage 5: Dependency Scan ---
      - name: Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

      # --- Stage 6: Build Stage ---
      - name: Build Docker Image
        run: |
          docker build -t showsecure-app:latest .

      # --- Stage 7: Image Scan ---
      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # --- Stage 8: Deployment Stage ---
      - name: Deploy with Docker Compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        run: |
          docker compose up -d
