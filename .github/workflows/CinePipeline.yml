name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  pipeline:
    # Use 20.04 because ubuntu-latest does not support Python 3.6 natively
    runs-on: ubuntu-20.04 
    
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}

    steps:
      # --- Stage 1: Checkout & Dependency Lock ---
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.6'

      - name: Dependency Lock Check
        run: |
          if [ ! -f requirements.txt ]; then 
            echo "Error: requirements.txt is missing!"
            exit 1 
          fi
          pip install -r requirements.txt

      # --- Stage 2: Lint + SAST ---
      - name: Run Lint (Flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r . -f txt

      # --- Stage 3: Secret Scan ---
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Stage 4: Unit Tests ---
      - name: Run Unit Tests (Pytest)
        run: |
          pip install pytest
          pytest

      # --- Stage 5: Dependency Scan ---
      - name: Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

      # --- Stage 6 & 7: Docker Build & Image Scan ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # --- Stage 8: Deploy ---
      - name: Deploy with Docker Compose
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        run: |
          docker-compose up -d
