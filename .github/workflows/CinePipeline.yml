name: ShowSecure DevSecOps Pipeline

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Lint (Flake8)
        run: |
          pip install flake8
          flake8 . || true

      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r . || true

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true

  unit-tests:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install markupsafe==2.0.1 jinja2==3.0.3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest tests/

  build-and-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

      - name: Image Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'showsecure-app:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
      FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
      CASHIER_USERNAME: ${{ secrets.CASHIER_USERNAME }}
      CASHIER_PASSWORD: ${{ secrets.CASHIER_PASSWORD }}
      MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
      GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image (for deployment)
        run: |
          docker build \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            --build-arg FLASK_SECRET=$FLASK_SECRET \
            -t showsecure-app:latest .

      - name: Create Prometheus Config
        run: |
          mkdir -p monitoring/prometheus
          cat > monitoring/prometheus/prometheus.yml << 'EOF'
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'flask-app'
              static_configs:
                - targets: ['app:5000']
              metrics_path: '/metrics'
              scrape_interval: 10s

            - job_name: 'cadvisor'
              static_configs:
                - targets: ['cadvisor:8080']
              scrape_interval: 10s

            - job_name: 'mysqld-exporter'
              static_configs:
                - targets: ['mysqld_exporter:9104']
              scrape_interval: 15s
          EOF

      - name: Create Grafana Provisioning Config
        run: |
          mkdir -p monitoring/grafana/provisioning/datasources
          mkdir -p monitoring/grafana/provisioning/dashboards
          mkdir -p monitoring/grafana/dashboards

          cat > monitoring/grafana/provisioning/datasources/prometheus.yml << 'EOF'
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: false
          EOF

          cat > monitoring/grafana/provisioning/dashboards/provider.yml << 'EOF'
          apiVersion: 1
          providers:
            - name: 'ShowSecure Dashboards'
              orgId: 1
              folder: 'ShowSecure'
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              options:
                path: /var/lib/grafana/dashboards
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d

      - name: Wait for Stack to be Healthy
        run: |
          echo "Waiting for services to start..."
          sleep 20

      - name: Verify Prometheus is Up
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused \
            http://localhost:9090/-/healthy || echo "Prometheus health check failed"

      - name: Verify Grafana is Up
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused \
            http://localhost:3000/api/health || echo "Grafana health check failed"
